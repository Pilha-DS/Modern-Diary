[project]
name = "modern-diary-backend"
version = "0.1.0"
description = "API do Modern Diary"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "pymysql>=1.1",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
