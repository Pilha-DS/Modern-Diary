[project]
name = "modern-diary-backend"
version = "0.1.0"
description = "API do Modern Diary"
requires-python = ">=3.12"
dependencies = [
    "atena-pattern",
    "alembic>=1.14",
    "pymysql>=1.1",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.uv]
package = false

# O núcleo do padrão mora no mesmo repositório: editar packages/atena_pattern
# reflete aqui sem reinstalar.
[tool.uv.sources]
atena-pattern = { path = "../../packages/atena_pattern", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
